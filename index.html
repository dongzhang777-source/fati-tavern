<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // interactive-widget 是键盘行为指令。安卓用 resizes-content（布局视口原生收缩）。
      // iOS PWA 依靠 apple-mobile-web-app-status-bar-style=black-translucent 沉浸式铺满视口
      if (!/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        var m = document.querySelector('meta[name=viewport]')
        if (m) m.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content'
      }
    </script>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="肥猫酒馆" />
    <meta name="description" content="肥猫酒馆 FATI Tavern：拖一张角色卡进来，和 TA 聊天。BYOK，隐私不离开你的设备。Drop a character card in and chat." />
    <!-- Open Graph / Twitter：SEO 与社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="肥猫酒馆 FATI Tavern" />
    <meta property="og:title" content="肥猫酒馆 — 免费开源的浏览器端 AI 角色扮演" />
    <meta property="og:description" content="零安装 · 零注册 · 零后端。兼容 SillyTavern 角色卡，BYOK 或免 Key 浏览器本地推理，你的对话隐私永不离开设备。Free, open-source, private AI roleplay PWA." />
    <meta property="og:url" content="https://fati-tavern.vercel.app/" />
    <meta property="og:image" content="https://fati-tavern.vercel.app/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="肥猫酒馆 — 免费开源的浏览器端 AI 角色扮演" />
    <meta name="twitter:description" content="零安装 · 零注册 · 零后端。兼容 SillyTavern 角色卡，BYOK 或免 Key 浏览器本地推理。Free & private AI roleplay PWA." />
    <meta name="twitter:image" content="https://fati-tavern.vercel.app/icon-512.png" />
    <!-- M-6：CSP 纵深防线（当前渲染层无 XSS sink，防未来引入注入点/依赖投毒后无限制执行）。
         script-src 保持 'self'；'wasm-unsafe-eval' 为 WebLLM/WASM 所需；
         connect-src 含 https: 是 BYOK 直连任意端点 + WebLLM 模型下载（HF CDN）所必需 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* wss:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" />
    <title>FATI Tavern</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
