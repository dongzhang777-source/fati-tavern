<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 肥猫酒馆 FATI Tavern logo：原创胖猫形象（圆润憨厚风，非任何受版权保护角色） -->
  <rect width="512" height="512" rx="112" fill="#1a1a2e"/>
  <circle cx="256" cy="272" r="190" fill="#e94560" opacity="0.08"/>

  <!-- 尾巴 -->
  <path d="M398 340c44 8 62 44 40 66-16 16-44 10-48-12" fill="none" stroke="#5d6d8f" stroke-width="26" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <path d="M138 168 L112 84 c-2-9 7-15 14-10 l64 44 Z" fill="#5d6d8f"/>
  <path d="M374 168 L400 84 c2-9-7-15-14-10 l-64 44 Z" fill="#5d6d8f"/>
  <path d="M144 150 L130 106 l36 25 Z" fill="#f2e6d8" opacity="0.85"/>
  <path d="M368 150 L382 106 l-36 25 Z" fill="#f2e6d8" opacity="0.85"/>

  <!-- 身体（浑圆一体） -->
  <path d="M256 96 c-104 0 -172 84 -172 192 0 86 76 132 172 132 s172 -46 172 -132 C428 180 360 96 256 96 Z" fill="#5d6d8f"/>

  <!-- 肚皮 -->
  <ellipse cx="256" cy="336" rx="112" ry="80" fill="#f2e6d8"/>

  <!-- 肚皮花纹（浅弧线三道，龙猫式憨感但为原创纹样） -->
  <path d="M204 300 q10 -14 24 -2" fill="none" stroke="#d9c6ae" stroke-width="7" stroke-linecap="round"/>
  <path d="M244 292 q10 -14 24 -2" fill="none" stroke="#d9c6ae" stroke-width="7" stroke-linecap="round"/>
  <path d="M284 300 q10 -14 24 -2" fill="none" stroke="#d9c6ae" stroke-width="7" stroke-linecap="round"/>

  <!-- 眼睛 -->
  <circle cx="200" cy="222" r="16" fill="#16213e"/>
  <circle cx="312" cy="222" r="16" fill="#16213e"/>
  <circle cx="205" cy="217" r="5" fill="#fff"/>
  <circle cx="317" cy="217" r="5" fill="#fff"/>

  <!-- 鼻子与嘴 -->
  <path d="M248 244 q8 8 16 0" fill="none" stroke="#16213e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="238" r="7" fill="#e94560"/>

  <!-- 胡须 -->
  <path d="M150 236 h-44 M154 254 l-42 12" stroke="#8fa0c2" stroke-width="6" stroke-linecap="round"/>
  <path d="M362 236 h44 M358 254 l42 12" stroke="#8fa0c2" stroke-width="6" stroke-linecap="round"/>

  <!-- 左爪搭在肚皮上 -->
  <ellipse cx="176" cy="360" rx="34" ry="24" fill="#5d6d8f"/>

  <!-- 木酒杯（右爪抱着） -->
  <g transform="rotate(8 330 360)">
    <rect x="296" y="322" width="70" height="86" rx="12" fill="#a4682d"/>
    <rect x="296" y="322" width="70" height="86" rx="12" fill="none" stroke="#7d4e1f" stroke-width="5"/>
    <line x1="314" y1="330" x2="314" y2="400" stroke="#7d4e1f" stroke-width="4"/>
    <line x1="348" y1="330" x2="348" y2="400" stroke="#7d4e1f" stroke-width="4"/>
    <path d="M366 340 q26 4 22 28 q-4 22 -24 18" fill="none" stroke="#7d4e1f" stroke-width="10" stroke-linecap="round"/>
    <!-- 泡沫 -->
    <circle cx="310" cy="318" r="12" fill="#fff8ee"/>
    <circle cx="331" cy="312" r="14" fill="#fff8ee"/>
    <circle cx="352" cy="318" r="11" fill="#fff8ee"/>
  </g>
  <!-- 右爪 -->
  <ellipse cx="306" cy="398" rx="30" ry="20" fill="#5d6d8f" transform="rotate(8 306 398)"/>
</svg>
