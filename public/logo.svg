<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="320" height="256">
      <defs>
        <!-- 橘猫渐变 -->
        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#FFA050"></stop>
          <stop offset="60%" stop-color="#FF8C42"></stop>
          <stop offset="100%" stop-color="#E07020"></stop>
        </radialGradient>
        <radialGradient id="bellyGrad" cx="50%" cy="45%" r="50%">
          <stop offset="0%" stop-color="#FFE8CC"></stop>
          <stop offset="100%" stop-color="#FFD699"></stop>
        </radialGradient>
        <radialGradient id="headGrad" cx="45%" cy="40%" r="50%">
          <stop offset="0%" stop-color="#FFB060"></stop>
          <stop offset="100%" stop-color="#FF8C42"></stop>
        </radialGradient>
        <!-- 耳朵内部渐变 -->
        <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFD699"></stop>
          <stop offset="100%" stop-color="#FFB060"></stop>
        </radialGradient>
        <!-- 阴影 -->
        <filter id="softShadow">
          <feOffset dx="0" dy="4"></feOffset>
          <feGaussianBlur stdDeviation="4"></feGaussianBlur>
          <feComponentTransfer><feFuncA type="linear" slope="0.25"></feFuncA></feComponentTransfer>
        </filter>
      </defs>

      <!-- 背景圆 -->
      <circle cx="200" cy="140" r="120" fill="none" stroke="#3d3028" stroke-width="1.5" opacity="0.5"></circle>

      <!-- 身体 -- 肥猫圆滚滚 -->
      <ellipse cx="200" cy="195" rx="85" ry="70" fill="url(#bodyGrad)" filter="url(#softShadow)"></ellipse>
      <!-- 肚子 -- 浅色 -->
      <ellipse cx="200" cy="205" rx="55" ry="45" fill="url(#bellyGrad)"></ellipse>

      <!-- 尾巴 -- 龙猫式抽象曲线 -->
      <path d="M 280,175 Q 320,140 310,100 Q 305,80 290,85 Q 275,90 280,105 Q 285,120 275,140" fill="none" stroke="#E07020" stroke-width="6" stroke-linecap="round"></path>

      <!-- 头部 -->
      <circle cx="200" cy="95" r="50" fill="url(#headGrad)"></circle>

      <!-- 左耳 -->
      <path d="M 165,70 L 150,30 L 180,55 Z" fill="#FF8C42"></path>
      <path d="M 165,70 L 153,38 L 176,58 Z" fill="url(#earInner)"></path>

      <!-- 右耳 -->
      <path d="M 235,70 L 250,30 L 220,55 Z" fill="#FF8C42"></path>
      <path d="M 235,70 L 247,38 L 224,58 Z" fill="url(#earInner)"></path>

      <!-- 脸部线条 (龙猫抽象风格 -- 简洁线条) -->
      <!-- 左眼 -->
      <ellipse cx="183" cy="88" rx="8" ry="7" fill="#3D2B1F"></ellipse>
      <circle cx="185" cy="86" r="2.5" fill="#FFE8CC"></circle>
      <!-- 右眼 -->
      <ellipse cx="217" cy="88" rx="8" ry="7" fill="#3D2B1F"></ellipse>
      <circle cx="219" cy="86" r="2.5" fill="#FFE8CC"></circle>

      <!-- 鼻子 -->
      <path d="M 200,100 L 196,105 L 204,105 Z" fill="#FF6B35"></path>

      <!-- 嘴巴 -- 单一线条微笑 (龙猫抽象) -->
      <path d="M 192,110 Q 200,118 208,110" fill="none" stroke="#3D2B1F" stroke-width="2" stroke-linecap="round"></path>

      <!-- 胡须 -- 三根 per side, 轻细 -->
      <line x1="165" y1="98" x2="130" y2="93" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round"></line>
      <line x1="163" y1="106" x2="128" y2="106" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round"></line>
      <line x1="165" y1="114" x2="130" y2="117" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round"></line>
      <line x1="235" y1="98" x2="270" y2="93" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round"></line>
      <line x1="237" y1="106" x2="272" y2="106" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round"></line>
      <line x1="235" y1="114" x2="270" y2="117" stroke="#3D2B1F" stroke-width="1.5" stroke-linecap="round"></line>

      <!-- 头顶一根呆毛 (character mark) -->
      <path d="M 200,45 L 196,25 L 204,28 L 202,45" fill="#FF8C42" stroke="#E07020" stroke-width="1"></path>

      <!-- FATI 文字 -->
      <text x="200" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#f5f0e8" letter-spacing="4">FATI</text>
      <text x="200" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#a89282" letter-spacing="3">TAVERN</text>
    </svg>