name: 功能建议 / Feature request
description: 提议一个新功能或改进 / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。Thanks! Chinese or English, either works.
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？/ What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案 / Your idea
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false
